server.port=8085
spring.application.name=payment-management-service

# MongoDB
spring.data.mongodb.uri=mongodb+srv://dbuser:dbuser2026@test.ubtlnvl.mongodb.net/client?appName=TEST
spring.data.mongodb.auto-index-creation=true

logging.level.org.mongodb.driver.cluster=WARN

# JWT (same shared secret as other services)
jwt.secret=${JWT_SECRET:dev-secret-change-me}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Stripe Configuration
stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_your_stripe_test_key_here}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_your_webhook_secret_here}

# Inter-service communication
appointment.service.url=${APPOINTMENT_SERVICE_URL:http://localhost:8080}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
